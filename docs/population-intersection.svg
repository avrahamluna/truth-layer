<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#22d3ee" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1180" height="640" fill="#0a0e17"/>

  <!-- title -->
  <text x="590" y="48" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700">Intersection = trusted population</text>
  <text x="590" y="74" text-anchor="middle" fill="#8b93a7" font-size="14.5">When sources disagree, the trusted number is the verified overlap — never the bigger one</text>

  <!-- ============ VENN (circles sized ∝ √count so area ≈ count) ============ -->
  <!-- payments 52K -> r=170 ; app 48K -> r=163 ; ad 31K -> r=131 -->
  <g>
    <circle cx="470" cy="288" r="170" fill="#ff6b9d" fill-opacity="0.15" stroke="#ff6b9d" stroke-width="1.6"/>
    <circle cx="408" cy="412" r="163" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.6"/>
    <circle cx="560" cy="424" r="131" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.6"/>
  </g>

  <!-- source labels (pushed clear of all borders) -->
  <text x="470" y="96" text-anchor="middle" fill="#ff6b9d" font-size="15.5" font-weight="700">payments</text>
  <text x="470" y="115" text-anchor="middle" fill="#7c869c" font-size="12">52K identities</text>

  <text x="150" y="470" text-anchor="middle" fill="#a855f7" font-size="15.5" font-weight="700">app / CRM</text>
  <text x="150" y="489" text-anchor="middle" fill="#7c869c" font-size="12">48K identities</text>
  <line x1="200" y1="466" x2="262" y2="430" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>

  <text x="700" y="540" text-anchor="middle" fill="#f59e0b" font-size="15.5" font-weight="700">ad / affiliate</text>
  <text x="700" y="559" text-anchor="middle" fill="#7c869c" font-size="12">31K identities</text>
  <line x1="665" y1="524" x2="600" y2="486" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>

  <!-- trusted core (at the 3-way overlap) -->
  <g filter="url(#coreGlow)">
    <circle cx="478" cy="375" r="54" fill="#0d1b26" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="478" y="365" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="800">24K</text>
  <text x="478" y="387" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">TRUSTED</text>
  <text x="478" y="402" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">POPULATION</text>

  <!-- schematic note -->
  <text x="300" y="128" text-anchor="middle" fill="#5b6478" font-size="11" font-style="italic">circle area ∝ identities</text>

  <!-- ============ RIGHT PANEL ============ -->
  <g filter="url(#soft)">
    <rect x="800" y="150" width="340" height="360" rx="14" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
  </g>
  <text x="826" y="188" fill="#e2e8f0" font-size="16" font-weight="700">Two rules at work</text>
  <line x1="826" y1="202" x2="1114" y2="202" stroke="#1f2937" stroke-width="1"/>

  <circle cx="836" cy="232" r="4" fill="#22d3ee"/>
  <text x="852" y="237" fill="#cbd5e1" font-size="13.5" font-weight="600">Intersection over max</text>
  <text x="852" y="258" fill="#8b93a7" font-size="12.5">The overlap is verified in every</text>
  <text x="852" y="276" fill="#8b93a7" font-size="12.5">source — so it's the number you</text>
  <text x="852" y="294" fill="#8b93a7" font-size="12.5">can defend, not the biggest circle.</text>

  <circle cx="836" cy="330" r="4" fill="#22d3ee"/>
  <text x="852" y="335" fill="#cbd5e1" font-size="13.5" font-weight="600">Deltas logged, not hidden</text>
  <text x="852" y="356" fill="#8b93a7" font-size="12.5">Each source-only slice is explained</text>
  <text x="852" y="374" fill="#8b93a7" font-size="12.5">(paid-not-in-CRM, etc.), never</text>
  <text x="852" y="392" fill="#8b93a7" font-size="12.5">quietly dropped.</text>

  <!-- delta legend inside panel (moved off the circles for contrast) -->
  <line x1="826" y1="418" x2="1114" y2="418" stroke="#1f2937" stroke-width="1"/>
  <circle cx="836" cy="440" r="3.5" fill="#ff6b9d"/>
  <text x="850" y="445" fill="#94a3b8" font-size="12">paid, not in CRM</text>
  <circle cx="836" cy="464" r="3.5" fill="#a855f7"/>
  <text x="850" y="469" fill="#94a3b8" font-size="12">signed up, never paid</text>
  <circle cx="836" cy="488" r="3.5" fill="#f59e0b"/>
  <text x="850" y="493" fill="#94a3b8" font-size="12">clicked, no account</text>

  <!-- footer -->
  <text x="590" y="612" text-anchor="middle" fill="#5b6478" font-size="11.5">Example figures, synthetic and rounded · the trusted population is the reconciled overlap, with every delta accounted for</text>
</svg>
