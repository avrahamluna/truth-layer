<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#22d3ee" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1180" height="620" fill="#0a0e17"/>

  <!-- title -->
  <text x="590" y="48" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700">Intersection = trusted population</text>
  <text x="590" y="74" text-anchor="middle" fill="#8b93a7" font-size="14.5">When sources disagree, the trusted number is the verified overlap — never the bigger one</text>

  <!-- ============ VENN ============ -->
  <!-- three circles, additive blending via opacity -->
  <g>
    <!-- Payments (top) -->
    <circle cx="480" cy="290" r="170" fill="#ff6b9d" fill-opacity="0.16" stroke="#ff6b9d" stroke-width="1.6"/>
    <!-- App / CRM (bottom-left) -->
    <circle cx="410" cy="410" r="170" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-width="1.6"/>
    <!-- Ad / affiliate (bottom-right) -->
    <circle cx="560" cy="410" r="170" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.6"/>
  </g>

  <!-- source labels -->
  <text x="480" y="150" text-anchor="middle" fill="#ff6b9d" font-size="15.5" font-weight="700">payments</text>
  <text x="480" y="170" text-anchor="middle" fill="#7c869c" font-size="12">52K identities</text>

  <text x="250" y="470" text-anchor="middle" fill="#a855f7" font-size="15.5" font-weight="700">app / CRM</text>
  <text x="250" y="490" text-anchor="middle" fill="#7c869c" font-size="12">48K identities</text>

  <text x="720" y="470" text-anchor="middle" fill="#f59e0b" font-size="15.5" font-weight="700">ad / affiliate</text>
  <text x="720" y="490" text-anchor="middle" fill="#7c869c" font-size="12">31K identities</text>

  <!-- trusted core -->
  <g filter="url(#coreGlow)">
    <circle cx="483" cy="370" r="52" fill="#0d1b26" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="483" y="360" text-anchor="middle" fill="#22d3ee" font-size="22" font-weight="800">24K</text>
  <text x="483" y="382" text-anchor="middle" fill="#67e8f9" font-size="11.5" font-weight="600">TRUSTED</text>
  <text x="483" y="398" text-anchor="middle" fill="#67e8f9" font-size="11.5" font-weight="600">POPULATION</text>

  <!-- delta callouts -->
  <g font-size="11.5">
    <circle cx="483" cy="245" r="3" fill="#ff6b9d"/>
    <text x="483" y="228" text-anchor="middle" fill="#94a3b8">paid, not in CRM</text>
    <circle cx="360" cy="430" r="3" fill="#a855f7"/>
    <text x="360" y="450" text-anchor="middle" fill="#94a3b8">signed up, never paid</text>
    <circle cx="605" cy="430" r="3" fill="#f59e0b"/>
    <text x="605" y="450" text-anchor="middle" fill="#94a3b8">clicked, no account</text>
  </g>

  <!-- ============ RIGHT PANEL ============ -->
  <g filter="url(#soft)">
    <rect x="800" y="150" width="340" height="320" rx="14" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
  </g>
  <text x="826" y="188" fill="#e2e8f0" font-size="16" font-weight="700">Two rules at work</text>
  <line x1="826" y1="202" x2="1114" y2="202" stroke="#1f2937" stroke-width="1"/>

  <circle cx="836" cy="232" r="4" fill="#22d3ee"/>
  <text x="852" y="237" fill="#cbd5e1" font-size="13.5" font-weight="600">Intersection over max</text>
  <text x="852" y="258" fill="#8b93a7" font-size="12.5">The overlap is verified in every</text>
  <text x="852" y="276" fill="#8b93a7" font-size="12.5">source — so it's the number you</text>
  <text x="852" y="294" fill="#8b93a7" font-size="12.5">can defend, not the biggest circle.</text>

  <circle cx="836" cy="330" r="4" fill="#22d3ee"/>
  <text x="852" y="335" fill="#cbd5e1" font-size="13.5" font-weight="600">Deltas logged, not hidden</text>
  <text x="852" y="356" fill="#8b93a7" font-size="12.5">Each source-only slice is explained</text>
  <text x="852" y="374" fill="#8b93a7" font-size="12.5">(paid-not-in-CRM, etc.), never</text>
  <text x="852" y="392" fill="#8b93a7" font-size="12.5">quietly dropped.</text>

  <rect x="826" y="418" width="288" height="34" rx="8" fill="#0c1f14" stroke="#4ade80" stroke-width="1.2"/>
  <text x="970" y="440" text-anchor="middle" fill="#86efac" font-size="12.5" font-weight="600">matched via id → email → fuzzy</text>

  <!-- footer -->
  <text x="590" y="596" text-anchor="middle" fill="#5b6478" font-size="11.5">Example figures, synthetic and rounded · the trusted population is the reconciled overlap, with every delta accounted for</text>
</svg>
