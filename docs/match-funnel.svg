<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="fArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="tier1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="620" fill="#0a0e17"/>

  <text x="590" y="48" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700">How records become one population</text>
  <text x="590" y="74" text-anchor="middle" fill="#8b93a7" font-size="14.5">Three sources funnel through match tiers — each pass resolves more, the rest is logged, not lost</text>

  <!-- ===== SOURCES (left) ===== -->
  <text x="150" y="126" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">SOURCES</text>
  <g filter="url(#soft)">
    <rect x="40" y="152" width="220" height="56" rx="10" fill="#111827" stroke="#ff6b9d" stroke-width="1.3"/>
    <text x="60" y="177" fill="#e2e8f0" font-size="14.5" font-weight="600">payments</text>
    <text x="240" y="177" text-anchor="end" fill="#ff6b9d" font-size="14" font-weight="700">52K</text>
    <text x="60" y="196" fill="#7c869c" font-size="11.5">charges · refunds</text>
  </g>
  <g filter="url(#soft)">
    <rect x="40" y="224" width="220" height="56" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.3"/>
    <text x="60" y="249" fill="#e2e8f0" font-size="14.5" font-weight="600">app / CRM</text>
    <text x="240" y="249" text-anchor="end" fill="#a855f7" font-size="14" font-weight="700">48K</text>
    <text x="60" y="268" fill="#7c869c" font-size="11.5">orders · signups</text>
  </g>
  <g filter="url(#soft)">
    <rect x="40" y="296" width="220" height="56" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="60" y="321" fill="#e2e8f0" font-size="14.5" font-weight="600">ad / affiliate</text>
    <text x="240" y="321" text-anchor="end" fill="#f59e0b" font-size="14" font-weight="700">31K</text>
    <text x="60" y="340" fill="#7c869c" font-size="11.5">clicks · conversions</text>
  </g>
  <text x="150" y="382" text-anchor="middle" fill="#5b6478" font-size="11.5">131K raw records</text>

  <!-- connectors into funnel: all three sources converge -->
  <path d="M 260 180 C 300 180, 312 260, 336 288" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M 260 252 C 300 252, 312 280, 336 292" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M 260 324 C 300 324, 312 300, 336 296" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.75"/>
  <path d="M 330 292 L 356 292" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#fArrow)"/>

  <!-- ===== FUNNEL (center) ===== -->
  <text x="620" y="126" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">MATCH TIERS</text>

  <!-- tier 1: exact id -->
  <g filter="url(#soft)">
    <rect x="360" y="150" width="520" height="58" rx="9" fill="url(#tier1)"/>
    <text x="380" y="176" fill="#052e33" font-size="14.5" font-weight="700">Tier 1 · exact id</text>
    <text x="380" y="196" fill="#0b3d47" font-size="11.5">shared primary key across sources</text>
    <text x="860" y="186" text-anchor="end" fill="#052e33" font-size="18" font-weight="800">+19K</text>
  </g>
  <!-- tier 2: email -->
  <g filter="url(#soft)">
    <rect x="400" y="228" width="440" height="58" rx="9" fill="url(#tier2)"/>
    <text x="420" y="254" fill="#052e33" font-size="14.5" font-weight="700">Tier 2 · email</text>
    <text x="420" y="274" fill="#0b3d47" font-size="11.5">normalized email match</text>
    <text x="820" y="264" text-anchor="end" fill="#052e33" font-size="18" font-weight="800">+4K</text>
  </g>
  <!-- tier 3: fuzzy -->
  <g filter="url(#soft)">
    <rect x="440" y="306" width="360" height="58" rx="9" fill="url(#tier3)"/>
    <text x="460" y="332" fill="#1e1b4b" font-size="14.5" font-weight="700">Tier 3 · fuzzy</text>
    <text x="460" y="352" fill="#312e81" font-size="11.5">name + attributes, thresholded</text>
    <text x="780" y="342" text-anchor="end" fill="#1e1b4b" font-size="18" font-weight="800">+1K</text>
  </g>

  <!-- arrow down to result -->
  <path d="M 620 372 L 620 418" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#fArrow)"/>

  <!-- ===== TRUSTED RESULT ===== -->
  <g filter="url(#soft)">
    <rect x="410" y="426" width="420" height="76" rx="13" fill="#0d1b26" stroke="#22d3ee" stroke-width="2"/>
    <text x="440" y="462" fill="#22d3ee" font-size="26" font-weight="800">24K</text>
    <text x="520" y="456" fill="#e2e8f0" font-size="14" font-weight="600">trusted population</text>
    <text x="520" y="476" fill="#7c869c" font-size="11.5">verified in every source it should be in</text>
  </g>

  <!-- ===== DELTAS (right) ===== -->
  <text x="1030" y="126" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">LOGGED DELTAS</text>
  <g filter="url(#soft)">
    <rect x="912" y="150" width="228" height="214" rx="12" fill="#160c14" stroke="#3a2530" stroke-width="1.3"/>
  </g>
  <text x="932" y="180" fill="#e2e8f0" font-size="13.5" font-weight="700">Unmatched, explained</text>
  <line x1="932" y1="192" x2="1120" y2="192" stroke="#3a2530" stroke-width="1"/>
  <circle cx="940" cy="216" r="3" fill="#ff6b9d"/>
  <text x="954" y="221" fill="#cbd5e1" font-size="12.5">paid, not in CRM</text>
  <text x="1120" y="221" text-anchor="end" fill="#94a3b8" font-size="12.5">3K</text>
  <circle cx="940" cy="248" r="3" fill="#a855f7"/>
  <text x="954" y="253" fill="#cbd5e1" font-size="12.5">signup, never paid</text>
  <text x="1120" y="253" text-anchor="end" fill="#94a3b8" font-size="12.5">9K</text>
  <circle cx="940" cy="280" r="3" fill="#f59e0b"/>
  <text x="954" y="285" fill="#cbd5e1" font-size="12.5">click, no account</text>
  <text x="1120" y="285" text-anchor="end" fill="#94a3b8" font-size="12.5">7K</text>
  <line x1="932" y1="306" x2="1120" y2="306" stroke="#3a2530" stroke-width="1"/>
  <text x="932" y="332" fill="#8b93a7" font-size="11.5">Deltas are surfaced as rows,</text>
  <text x="932" y="349" fill="#8b93a7" font-size="11.5">never silently dropped.</text>

  <!-- footer -->
  <text x="590" y="596" text-anchor="middle" fill="#5b6478" font-size="11.5">Example figures, synthetic and rounded · intersection over max — the defensible number is the one verified everywhere it should exist</text>
</svg>
