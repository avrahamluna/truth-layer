<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4ade80"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="hubGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1180" height="640" fill="#0a0e17"/>

  <!-- title -->
  <text x="590" y="48" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="700">truth-layer</text>
  <text x="590" y="74" text-anchor="middle" fill="#8b93a7" font-size="14.5">Three contradictory sources → one reconciled, auditable number</text>

  <!-- column headers -->
  <text x="150" y="128" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">SOURCES</text>
  <text x="590" y="128" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">TRUTH LAYER</text>
  <text x="1030" y="128" text-anchor="middle" fill="#6b7280" font-size="12.5" font-weight="600" letter-spacing="2">CONSUMERS</text>

  <!-- ============ connectors (drawn first, behind boxes) ============ -->
  <!-- sources -> hub -->
  <path d="M 268 200 C 340 200, 360 300, 428 300" fill="none" stroke="#ff6b9d" stroke-width="2"/>
  <path d="M 268 300 L 428 300" fill="none" stroke="#ff6b9d" stroke-width="2"/>
  <path d="M 268 400 C 340 400, 360 300, 428 300" fill="none" stroke="#ff6b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="285" text-anchor="middle" fill="#ff6b9d" font-size="12.5" font-weight="600">reconcile</text>

  <!-- hub -> consumers -->
  <path d="M 752 300 C 820 300, 840 200, 912 200" fill="none" stroke="#ff6b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 752 300 L 912 300" fill="none" stroke="#ff6b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 752 300 C 820 300, 840 400, 912 400" fill="none" stroke="#ff6b9d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="832" y="285" text-anchor="middle" fill="#ff6b9d" font-size="12.5" font-weight="600">serve</text>

  <!-- hub -> CI gate -->
  <path d="M 590 396 L 590 470" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="606" y="440" fill="#4ade80" font-size="12.5" font-weight="600">validate</text>

  <!-- ============ SOURCES ============ -->
  <g filter="url(#soft)">
    <rect x="40" y="168" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="60" y="196" fill="#e2e8f0" font-size="15.5" font-weight="600">payments</text>
    <text x="60" y="217" fill="#7c869c" font-size="12">charges · refunds · disputes</text>
  </g>
  <g filter="url(#soft)">
    <rect x="40" y="268" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="60" y="296" fill="#e2e8f0" font-size="15.5" font-weight="600">app / CRM</text>
    <text x="60" y="317" fill="#7c869c" font-size="12">orders · plans · signups</text>
  </g>
  <g filter="url(#soft)">
    <rect x="40" y="368" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="60" y="396" fill="#e2e8f0" font-size="15.5" font-weight="600">ad / affiliate</text>
    <text x="60" y="417" fill="#7c869c" font-size="12">clicks · conversions</text>
  </g>

  <!-- ============ HUB ============ -->
  <g filter="url(#hubGlow)">
    <rect x="428" y="176" width="324" height="248" rx="16" fill="#0d1b26" stroke="#22d3ee" stroke-width="1.8"/>
  </g>
  <text x="590" y="212" text-anchor="middle" fill="#22d3ee" font-size="17" font-weight="700">reconciliation core</text>
  <line x1="460" y1="228" x2="720" y2="228" stroke="#1e3a44" stroke-width="1"/>

  <g fill="#cbd5e1" font-size="13.5">
    <circle cx="470" cy="256" r="3" fill="#22d3ee"/>
    <text x="484" y="261">match tiers (id → email → fuzzy)</text>
    <circle cx="470" cy="288" r="3" fill="#22d3ee"/>
    <text x="484" y="293">intersection = trusted population</text>
    <circle cx="470" cy="320" r="3" fill="#22d3ee"/>
    <text x="484" y="325">one population, one method</text>
    <circle cx="470" cy="352" r="3" fill="#22d3ee"/>
    <text x="484" y="357">snapshot (fast) vs primary (truth)</text>
    <circle cx="470" cy="384" r="3" fill="#22d3ee"/>
    <text x="484" y="389">counting rules encoded as tests</text>
  </g>

  <!-- ============ CONSUMERS ============ -->
  <g filter="url(#soft)">
    <rect x="912" y="168" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="932" y="196" fill="#e2e8f0" font-size="15.5" font-weight="600">dashboards</text>
    <text x="932" y="217" fill="#7c869c" font-size="12">KPIs · trends</text>
  </g>
  <g filter="url(#soft)">
    <rect x="912" y="268" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="932" y="296" fill="#e2e8f0" font-size="15.5" font-weight="600">reports</text>
    <text x="932" y="317" fill="#7c869c" font-size="12">exec · financial</text>
  </g>
  <g filter="url(#soft)">
    <rect x="912" y="368" width="228" height="64" rx="11" fill="#111827" stroke="#2b3648" stroke-width="1.3"/>
    <text x="932" y="396" fill="#e2e8f0" font-size="15.5" font-weight="600">automated audits</text>
    <text x="932" y="417" fill="#7c869c" font-size="12">agents · alerts</text>
  </g>

  <!-- ============ CI GATE ============ -->
  <g filter="url(#soft)">
    <rect x="360" y="470" width="460" height="66" rx="12" fill="#0c1f14" stroke="#4ade80" stroke-width="1.6"/>
    <text x="590" y="500" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="700">CI gate — data-quality tests</text>
    <text x="590" y="521" text-anchor="middle" fill="#86efac" font-size="12.5">every push · population, DISTINCT, coverage, ranges, freshness</text>
  </g>

  <!-- footer note -->
  <text x="590" y="588" text-anchor="middle" fill="#5b6478" font-size="11.5">Rules as tests, not docs · a regression fails the build instead of silently shipping a wrong number</text>
  <text x="590" y="612" text-anchor="middle" fill="#3f4757" font-size="10.5">Generalized reference architecture</text>
</svg>
